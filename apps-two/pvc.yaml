apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-pvc
  name: registry-two
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
  volumeMode: Filesystem
